plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.rentbook_rentpropertymanager'

    defaultConfig {
        applicationId = "com.example.rentbook_rentpropertymanager"
    }

    compileSdk 35

    signingConfigs {
        debugCustom {
            storeFile file("rentbook-custom.jks")
            storePassword "rahulinder"
            keyAlias "rentbookalias"
            keyPassword "rahulinder"
        }
    }

    defaultConfig {
        applicationId "com.example.rentbook_rentpropertymanager"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debugCustom
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.auth
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid
    implementation libs.firebase.database
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation(libs.play.services.auth)

    // Import the BoM for the Firebase platform
    implementation(platform(libs.firebase.bom))

    implementation(libs.firebase.ui.database)

    // Add the dependency for the Firebase Authentication library
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation("com.google.firebase:firebase-auth")

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'com.leinardi.android:speed-dial:3.3.0'

    implementation("com.google.firebase:firebase-storage")

    implementation 'com.vanniktech:android-image-cropper:4.6.0'

    implementation libs.chrisbanes.photoview

}